
        <section class="contact" id="contact">

            <div class="container">

                <div class="section-heading">

                    <div class="section-label">
                        Contact
                    </div>

                    <h2>
                        Let's work together.
                    </h2>

                    <p>
                        Have a project, idea or opportunity?
                        Send me a message.
                    </p>

                </div>


                <div class="contact-grid">

                    <div class="contact-details">

                        <div class="contact-item">

                            <small>Email</small>

                            <span>
                                shardvinson@email.com
                            </span>

                        </div>


                        <div class="contact-item">

                            <small>Location</small>

                            <span>
                                NIR/Philippines
                            </span>

                        </div>


                        <div class="contact-item">

                            <small>Availability</small>

                            <span>
                                Open to opportunities
                            </span>

                        </div>

                    </div>


                    <form
                        class="contact-form"
                        id="contactForm">

                        <div class="form-row">

                            <input
                                type="text"
                                name="name"
                                placeholder="Your Name"
                                required
                            >

                            <input
                                type="email"
                                name="email"
                                placeholder="Your Email"
                                required
                            >

                        </div>


                        <input
                            type="text"
                            name="subject"
                            placeholder="Subject"
                            required
                        >


                        <textarea
                            name="message"
                            placeholder="Your Message"
                            required
                        ></textarea>


                        <button
                            type="submit"
                            class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>
